<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click N Slide - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #808080;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1100px;
            min-height: 650px;
            background: #073b6d;
            border: 3px solid #286b9f;
            position: relative;
            padding: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-title {
            position: absolute;
            top: 14px;
            left: 35px;
            color: #6fc5f5;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .copyright {
            position: absolute;
            top: 10px;
            right: 30px;
            color: #5bb9ed;
            border: 2px solid #00508d;
            border-radius: 20px;
            padding: 5px 30px;
            font-size: 14px;
            font-weight: bold;
        }

        .login-panel {
            width: 430px;
            background: #737300;
            border: 2px solid #a6a600;
            border-radius: 18px;
            padding: 8px;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.25);
        }

        .panel-inner {
            background: #969600;
            border: 2px solid #d0d000;
            border-radius: 14px;
            padding: 35px 40px 40px;
        }

        .logo {
            text-align: center;
            color: #f5f5b0;
            font-size: 38px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: -2px;
            margin-bottom: 5px;
            text-shadow: 2px 2px #666600;
        }

        .subtitle {
            text-align: center;
            color: #dddd77;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ffffcc;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            border: 3px solid #6b6b00;
            border-radius: 7px;
            background: #f4f4c8;
            color: #333333;
            font-size: 17px;
            padding: 0 12px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ffff00;
            background: #ffffff;
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: 2px solid #555500;
            border-radius: 6px;
            background: #dada00;
            color: #555500;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #6d6d00;
            transition: 0.15s;
        }

        .login-button:hover {
            background: #eeee22;
        }

        .login-button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .error-message {
            display: none;
            margin-top: 18px;
            padding: 10px;
            background: #5e0000;
            border: 1px solid #ff7777;
            border-radius: 5px;
            color: #ffffff;
            text-align: center;
            font-size: 14px;
        }

        .footer-text {
            position: absolute;
            bottom: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #6bb9e8;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .login-wrapper {
                min-height: 100vh;
                border: none;
                padding: 20px;
            }

            .top-title {
                left: 20px;
                font-size: 14px;
            }

            .copyright {
                display: none;
            }

            .login-panel {
                max-width: 100%;
            }

            .panel-inner {
                padding: 30px 25px;
            }

            .logo {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="top-title">
            CLICK N SLIDE
        </div>

        <div class="copyright">
            PUZZLE GAME
        </div>

        <div class="login-panel">

            <div class="panel-inner">

                <div class="logo">
                    Click N Slide
                </div>

                <div class="subtitle">
                    PUZZLE ADMIN LOGIN
                </div>

                <form id="loginForm" action="/login" method="POST">

                    <div class="form-group">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button">
                        LOGIN
                    </button>

                </form>

                <div id="errorMessage" class="error-message">
                    Invalid username or password.
                </div>

            </div>

        </div>

        <div class="footer-text">
            Puzzle Game &nbsp; | &nbsp; Admin Access
        </div>

    </div>

</body>
</html>
